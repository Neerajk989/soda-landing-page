name: Verify project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure pnpm
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run type-check and production build
        run: pnpm verify
